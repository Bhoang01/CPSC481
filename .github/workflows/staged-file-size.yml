name: Staged file size hook

on:
  pull_request:
    paths:
      - scripts/git-hooks/**
      - .husky/pre-commit
      - package.json
      - .github/workflows/staged-file-size.yml
  push:
    branches: [main, master]
    paths:
      - scripts/git-hooks/**
      - .husky/pre-commit
      - package.json
      - .github/workflows/staged-file-size.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-tests:
    name: staged-token-limit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node --test scripts/git-hooks/verify.mjs
